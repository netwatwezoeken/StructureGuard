name: .NET

on:
  push:
    branches: [ "main" ]
    tags:
      - '*'
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    permissions:
      contents: read
      id-token: write  # enable GitHub OIDC token issuance for this job

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Test
        run: dotnet test --no-build --verbosity normal

      # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
        
      - name: Nuget
        working-directory: ./src/StructureGuard
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          dotnet pack /p:Version=${{ github.ref_name }}
          dotnet nuget push ./nupkg/StructureGuard.${{ github.ref_name }}.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} -s https://api.nuget.org/v3/index.json
